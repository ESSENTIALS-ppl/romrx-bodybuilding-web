[build]
  command   = "npm run build"
  publish   = "dist"

# Serve marketing page at / via Netlify rewrite (before the SPA catch-all)
[[redirects]]
  from   = "/"
  to     = "/marketing.html"
  status = 200
  force  = true

# Legal page
[[redirects]]
  from   = "/legal"
  to     = "/legal.html"
  status = 200
  force  = true

# Marketing sub-pages
[[redirects]]
  from   = "/athletes"
  to     = "/athletes.html"
  status = 200
  force  = true

[[redirects]]
  from   = "/trainers"
  to     = "/trainers.html"
  status = 200
  force  = true

[[redirects]]
  from   = "/gyms"
  to     = "/gyms.html"
  status = 200
  force  = true

# SEO articles
[[redirects]]
  from   = "/articles"
  to     = "/articles.html"
  status = 200
  force  = true

[[redirects]]
  from   = "/sets-per-muscle-group-per-week"
  to     = "/sets-per-muscle-group-per-week.html"
  status = 200
  force  = true

# React SPA routes
[[redirects]]
  from   = "/login"
  to     = "/index.html"
  status = 200

# Standalone athlete signup is retired. New athletes create their account in
# ROMRx Base, so /signup redirects at the edge to the canonical Base explainer
# page. Netlify preserves the original query string on the hop, and the target
# is a different host so there is no redirect loop. /signup/coach is an exact
# earlier match and is unaffected.
[[redirects]]
  from   = "/signup/coach"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/signup"
  to     = "https://romrx.io/bodybuilding"
  status = 301
  force  = true

[[redirects]]
  from   = "/onboarding"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/onboarding/*"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/auth/*"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/dashboard"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/dashboard/*"
  to     = "/index.html"
  status = 200

# Legacy short paths — React app handles the redirect internally to /dashboard/*
[[redirects]]
  from   = "/my-body"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/my-training"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/my-protocol"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/chat"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/settings"
  to     = "/index.html"
  status = 200
